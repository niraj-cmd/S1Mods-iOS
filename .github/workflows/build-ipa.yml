name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build S1Mods IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build IPA
        working-directory: ./S1Mods
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # Create export options with team ID from secrets
          cat > exportOptions.plist << EOFO
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOFO

          echo "Building with team: ${{ secrets.DEVELOPMENT_TEAM }}"

          # Archive
          xcodebuild -project S1Mods.xcodeproj \
            -scheme S1Mods \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/S1Mods.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            archive

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/S1Mods.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

          # Copy to root for artifact
          cp build/ipa/S1Mods.ipa ./S1Mods.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: S1Mods-ipa
          path: S1Mods/S1Mods.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: S1Mods/S1Mods.ipa
          generate_release_notes: true
