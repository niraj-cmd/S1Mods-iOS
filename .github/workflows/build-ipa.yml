name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup App Store Connect API
        if: env.APP_STORE_CONNECT_ISSUER_ID != ''
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/private_keys/AuthKey.p8
          chmod 600 ~/private_keys/AuthKey.p8

      - name: Build IPA
        working-directory: ./S1Mods
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ~/private_keys/AuthKey.p8
          BUNDLE_ID: com.nirajashtaputre.s1mods
        run: |
          # Create export options
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          # Archive
          xcodebuild -project S1Mods.xcodeproj \
            -scheme S1Mods \
            -configuration Release \
            -destination "generic/platform/iOS" \
            -archivePath build/S1Mods.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            archive

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/S1Mods.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: S1Mods-ipa
          path: S1Mods/build/ipa/S1Mods.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: S1Mods/build/ipa/S1Mods.ipa
          generate_release_notes: true
